  <!-- 右页 AI 节点（镂空） -->
  <g fill="#F97316" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="37.2" cy="20.5" r="2" stroke="none"/>
    <circle cx="45.2" cy="23.5" r="2" stroke="none"/>
    <circle cx="36.5" cy="36.5" r="2" stroke="none"/>
    <circle cx="45.5" cy="34.5" r="2" stroke="none"/>
    <path d="M37.2 20.5 L40.8 27 L45.2 23.5" fill="none"/>
    <path d="M40.8 27 L36.5 36.5" fill="none"/>
    <path d="M40.8 27 L45.5 34.5" fill="none"/>
    <path fill="#F97316" stroke="none" d="
      M40.8 24.2
      L41.85 26.95
      L44.8 27.1
      L42.5 28.95
      L43.25 31.85
      L40.8 30.3
      L38.35 31.85

    <rect x="3" y="27.5" width="12" height="4" rx="2"/>
    <rect x="4.5" y="35" width="9" height="4" rx="2"/>
    <rect x="6" y="42.5" width="6.5" height="3.2" rx="1.6" opacity="0.72"/>


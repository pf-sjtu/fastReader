# Cloudflare Pages 配置（wrangler pages deploy / pages dev 使用）
#
# 首次部署步骤见 docs/deploy.md：
#   1. KV namespace 已创建（fastreader-shared-state）；fork 部署需换成自己的 id
#      注意：wrangler.toml 里的绑定会覆盖 Dashboard 里的设置
#   2. 在 Cloudflare Dashboard → Pages → 项目 → Settings → Environment variables 设置
#        APP_PASSWORD   共享登录密码（缺省 123456a）
#        SESSION_SECRET 可选，缺省由 APP_PASSWORD 派生；改密码会使所有会话失效
#        ALLOWED_ORIGINS 可选，逗号分隔的额外 CORS 白名单
#   3. `wrangler pages deploy dist`

name = "fast-read"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

kv_namespaces = [
  { binding = "FASTREADER_KV", id = "a4169b1ae0684d559ce632cfca325c91" }
]

# 书库索引放 D1（每书一行 + 逐书 CAS，不丢更新）；封面图与共享状态仍在 KV。
# 没绑定时回退到 KV 里的 covers:index（functions/_lib/coversStore.js）；首次使用会把 KV 旧索引复制进来。fork 部署需换成自己的库
[[d1_databases]]
binding = "FASTREADER_DB"
database_name = "fastreader-index"
database_id = "b6e45ad3-6b9f-4120-9876-ad37d4c3cda1"

# 本地开发（wrangler pages dev）用的预览 KV，id 指向同一 namespace 也可
[vars]
# 不要把真实密码写进仓库：正式环境在 Dashboard 里配置
# APP_PASSWORD = "change-me"

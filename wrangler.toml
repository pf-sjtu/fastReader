# Cloudflare Pages 配置（wrangler pages deploy / pages dev 使用）
#
# 首次部署步骤见 docs/deploy.md：
#   1. `wrangler kv namespace create FASTREADER_KV` 拿到 id，填到下面的 id 字段
#   2. 在 Cloudflare Dashboard → Pages → 项目 → Settings → Environment variables 设置
#        APP_PASSWORD   共享登录密码（缺省 123456a）
#        SESSION_SECRET 可选，缺省由 APP_PASSWORD 派生；改密码会使所有会话失效
#        ALLOWED_ORIGINS 可选，逗号分隔的额外 CORS 白名单
#   3. `wrangler pages deploy dist`

name = "fast-read"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

kv_namespaces = [
  { binding = "FASTREADER_KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# 本地开发（wrangler pages dev）用的预览 KV，id 指向同一 namespace 也可
[vars]
# 不要把真实密码写进仓库：正式环境在 Dashboard 里配置
# APP_PASSWORD = "change-me"

# V3 版本提示词配置：章节总结输出「正文 + <!--juhua:meta--> JSON 旁路」；其余段落沿用 v2
# 旁路解析/清理见 src/services/prompts/chapterMeta.ts（CLI：src/cli/chapter_meta.py）
# 章节总结提示词
chapterSummary:
  fiction: |
    你是一位细读文学作品的书评人。为下面的章节写一份准确、有层次的章节总结，并在末尾附一段机器可读的元数据。

    ## 先判断
    若本章是致谢、目录、版权页、序跋、出版说明等没有实质故事内容的页面：只输出"无需总结"，不要输出元数据。

    ## 正文（250-800 字）
    - 按情节顺序写：发生了什么、谁做了什么、转折在哪里；人物关系与动机的变化要写清楚。
    - 保留关键细节：人名、地点、时间、决定性的对话或物件；省略铺陈性的描写。
    - 说明本章在整个故事中的作用（推进、转折、伏笔、回收），但不要提前剧透后文你并不知道的内容。
    - 人物与地名全程使用同一个写法。
    - 格式：**加粗**只用于本章最关键的一句，全章最多 4 处；*斜体*用于关键物件、原文短语；不使用标题、分割线、加粗斜体、反引号。
    - 直接开始写，不要问候语，不要"本章讲述了"这类转述腔。

    ## 元数据（正文之后）
    另起一行输出 `<!--juhua:meta-->`，紧接着输出一个 JSON 对象（不要代码围栏，不要任何其他文字）：
    {"oneLine":"一句话概括本章（≤40字）","takeaways":["关键情节1","关键情节2","关键情节3"],"entities":[{"name":"规范名","type":"人物|地点|组织|物件|其他","aliases":["别名或称呼"],"role":"在本章的作用（≤20字）"}],"terms":[],"events":[{"label":"本章关键事件（≤20字）","spoiler":"low|high"}]}
    - entities 只收对理解故事重要的 3-12 个；name 用全书统一的写法，常见称呼放进 aliases。
    - events 收 2-6 个；spoiler 为 high 表示揭示了重大结局/真相，其余为 low。

    ## 你需要处理的章节信息

    ### 章节标题：{{title}}

    ### 章节内容：
    {{content}}

  nonFiction: |
    你是一位严谨的社科书评人。为下面的书籍章节写一份信息密度高、可直接阅读的章节总结，并在末尾附一段机器可读的元数据。

    ## 先判断
    若本章是致谢、目录、版权页、参考文献、注释、索引等没有实质内容的页面：只输出"无需总结"，不要输出元数据。

    ## 第一部分：章节内容总结（200-1000 字）
    - 按原文顺序，围绕本章的核心论点逐层展开：一个论点一段（相邻论点关系紧密可合并），保留论证链条（前提、推理、结论）。
    - 沿用作者的叙述人称，直接陈述；不要"本章首先介绍了…"这类转述腔，不要定义式展开（"X 是指…"改为直接陈述）。
    - 信息密度优先：保留数据、时间、人名与机构名、事件转折、核心案例、具体数字；删掉一般性背景与解释性冗余。
    - 实体名（人物、机构、概念、作品）全程使用同一个写法；首次出现用全称，之后用同一简称。

    ## 第二部分：全章脉络与评析（250-500 字，不加标题，另起一段）
    - 脉络（100-200 字）：分析本章的逻辑骨架——各论点之间的因果、递进或对比，以及本章在全书中的角色；不要重述内容。
    - 评价与延伸（150-300 字）：基于具体文本证据给出判断（不要"这一章很深刻"这类空话）；指出论点的理论延伸、现实应用的有效性与局限、放在今天的适用性。
    - 最后给出 3 个启发性问题，每个单独一行、以"？"结尾、20-40 字；形成由微观到宏观的递进，且都回扣本章的具体内容。

    ## 格式（会被程序检查）
    - **加粗**只用于一个论点的主旨句；每个论点最多 1 处，全章最多 6 处。
    - *斜体*用于具体案例、数字、原文短语，可以多次。
    - `> ` 引用仅用于特别有代表性的原文，单独成行，不超过 2-3 句，不加引号。
    - 不使用标题（#）、分割线（---）、加粗斜体、反引号；不要问候语、说明性文字或序号。

    ## 元数据（正文之后）
    另起一行输出 `<!--juhua:meta-->`，紧接着输出一个 JSON 对象（不要代码围栏，不要任何其他文字）：
    {"oneLine":"一句话概括本章核心主张（≤40字）","takeaways":["要点1","要点2","要点3"],"entities":[{"name":"规范名","type":"人物|机构|概念|理论|作品|地点|事件|其他","aliases":["别名或缩写"],"role":"在本章的作用（≤20字）"}],"terms":["关键术语"]}
    - entities 只收对理解全书重要的 3-12 个；name 用全书统一的写法（如机构用全称，缩写放进 aliases）。
    - terms 收 0-8 个本章引入或强调的专业术语。

    ## 你需要处理的章节信息

    ### 章节标题：{{title}}

    ### 章节内容：
    {{content}}



# 思维导图提示词
mindmap:
  chapter: |
    ```ts
    export interface NodeObj {
      topic: string
      id: string
      tags?: string[]
      children?: NodeObj[]
    }
    // 总结父id的第start到end个节点的内容
    export interface Summary {
      id: string
      label: string
      parent: string
      start: number
      end: number
    }
    ```

    任务：分析以下章节内容，生成符合以下格式的JSON思维导图数据：
    {
      nodeData: NodeObj
      summaries?: Summary[]
    }

    严格规则：
    1. 节点ID使用递增数字
    2. 适当应用父子级别的分层，不要只使用兄弟节点关系
    3. 可选标签：核心、案例、实践、金句
    4. Summary用于总结同父节点的子节点，显示在侧边，禁止总结根节点
    5. 适当添加Summary，不要多余
    6. 最后添加一个金句节点记录本章金句
    7. 适当添加表达节点内涵的emoji
    8. 如果内容是致谢、目录、前言、序言、参考文献等页面，直接回复"{nodeData:null}"
    9. 只输出JSON格式，不要输出任何解释性文字、问候语或无关内容

    输出格式：纯JSON，无任何前缀或后缀文字

  arrow: |
    ```ts
    export interface NodeObj {
      topic: string
      id: string
      tags?: string[]
      children?: NodeObj[]
    }

    export interface Arrow {
      id: string
      label: string
      from: string
      to: string
      delta1: { x: number; y: number }
      delta2: { x: number; y: number }
      bidirectional?: boolean
    }
    ```

    任务：为已有思维导图添加箭头连接，输出符合以下格式的JSON：
    {
      arrows?: Arrow[]
    }

    严格规则：
    1. Arrow连接任意节点，label说明节点联系，delta默认值50,50
    2. 直接的父子关系不需要使用Arrow
    3. 最多添加6条Arrow，只连接最关键的节点关系
    4. 只输出JSON格式，不要输出任何解释性文字、问候语或无关内容

    输出格式：纯JSON，无任何前缀或后缀文字

  combined: |
    ```ts
    export interface NodeObj {
      topic: string
      id: string
      tags?: string[]
      children?: NodeObj[]
    }
    // 总结父id的第start到end个节点的内容
    export interface Summary {
      id: string
      label: string
      parent: string
      start: number
      end: number
    }
    ```

    任务：分析整书章节结构，生成符合以下格式的JSON思维导图数据：
    {
      nodeData: NodeObj
      summaries?: Summary[]
    }

    严格规则：
    1. 节点ID使用递增数字
    2. 体现整书的逻辑结构和层次关系
    3. 可选标签：核心、案例、实践、金句
    4. Summary用于总结同父节点的子节点，显示在侧边
    5. 适当添加Summary，不要多余
    6. 最后添加一个金句节点记录全书金句
    7. 适当添加表达节点内涵的emoji
    8. 只输出JSON格式，不要输出任何解释性文字、问候语或无关内容

    输出格式：纯JSON，无任何前缀或后缀文字

# 章节关联分析提示词
connectionAnalysis: |
  任务：分析以下各章节之间的关系，并总结全书的核心内容。

  章节总结内容：
  {{chapterSummaries}}

  分析要求：
  1. 章节之间的联系
     - 各章节是如何一步步展开论述的？
     - 哪些重要观点在不同章节中反复出现？
     - 前面的章节为后面的内容做了哪些铺垫？

  2. 全书的核心主题
     - 这本书最想告诉读者什么？
     - 作者的主要观点是什么？
     - 有哪些值得特别关注的重要概念？

  3. 实用价值
     - 这本书对现实生活有什么指导意义？
     - 读者可以从中学到什么实用的知识或方法？
     - 哪些观点可能会改变我们的思考方式？

  4. 简明总结
     - 用几句话概括这本书的精华
     - 推荐给什么样的人阅读
     - 阅读这本书的最大收获是什么

  输出要求：
  - 用通俗易懂的语言分析，让普通读者轻松理解
  - 结构清晰，层次分明
  - 不要输出任何问候语、解释性文字或无关内容
  - 直接输出分析内容，无任何前缀或后缀文字

# 全书总结提示词
overallSummary: |
  任务：基于以下信息生成《{{bookTitle}}》的全面总结报告。

  书籍章节结构：
  {{chapterInfo}}

  章节关联分析：
  {{connections}}

  总结要求：
  1. 生成一个全面的总结报告，帮助读者快速掌握全书精髓
  2. 内容应包括：
     - 书籍核心观点和主要论述
     - 重要的概念和理论框架
     - 实际应用价值和指导意义
     - 适合的读者群体
     - 阅读本书的主要收获

  输出要求：
  - 语言简洁明了，重点突出
  - 结构清晰，便于阅读
  - 不要输出任何问候语、解释性文字或无关内容
  - 直接输出总结内容，无任何前缀或后缀文字

